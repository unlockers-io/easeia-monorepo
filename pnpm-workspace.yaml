packages:
  - apps/*
  - packages/*
  - tools/*

peerDependencyRules:
  allowedVersions:
    "@typescript-eslint/parser>typescript": "7"
    "@typescript-eslint/project-service>typescript": "7"
    "@typescript-eslint/tsconfig-utils>typescript": "7"
    "@typescript-eslint/typescript-estree>typescript": "7"
    "@typescript-eslint/utils>typescript": "7"

overrides:
  # Security: force patched transitive releases to clear pnpm audit advisories.
  # Each pin is the lowest release that carries the fix.
  # Prisma config merges plain records; v8 fixes recursive-graph stack exhaustion.
  "@prisma/config>deepmerge-ts": "^8.0.0"
  "body-parser@>=2.0.0 <2.4.0": "^2.4.0"
  esbuild: "^0.28.1"
  mysql2: "^3.23.1"
  nanoid: "^3.3.18"
  next: "^16.4.1"
  "undici@<7.30.1": "^7.30.1"
  "undici@>=8.0.0 <8.12.2": "^8.12.2"
  ws: "^8.21.0"

auditConfig:
  ignoreGhsas:
    - GHSA-ch52-4w7c-c8xp
    - GHSA-vfj7-8cjw-p6xm

allowBuilds:
  "@prisma/engines": true
  esbuild: true
  fallow: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  vue-demi: true

minimumReleaseAgeExclude:
  - "@dashfoo/*"
  - "@easeia/*"
  - "@usebutr/*"
  - "@walletwright/*"
  - astro-awesomeness
  - oxlint-config-awesomeness
  - "@bruits/satteri-darwin-arm64@0.10.3"
  - "@bruits/satteri-darwin-x64@0.10.3"
  - "@bruits/satteri-linux-arm64-gnu@0.10.3"
  - "@bruits/satteri-linux-arm64-musl@0.10.3"
  - "@bruits/satteri-linux-x64-gnu@0.10.3"
  - "@bruits/satteri-linux-x64-musl@0.10.3"
  - "@bruits/satteri-wasm32-wasi@0.10.3"
  - "@bruits/satteri-win32-arm64-msvc@0.10.3"
  - "@bruits/satteri-win32-x64-msvc@0.10.3"
  - satteri@0.10.3

nodeLinker: hoisted

trustPolicy: no-downgrade
trustPolicyExclude:
  - prisma@7.10.0
  - resend@6.18.1
  - semver@6.3.1
